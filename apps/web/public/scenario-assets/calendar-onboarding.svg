<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title">
  <title id="title">نمونه صفحه شروع زمان‌یار</title>
  <rect width="640" height="360" rx="22" fill="#f4f8f5"/>
  <rect x="88" y="22" width="464" height="316" rx="22" fill="#fff" stroke="#dce9df" stroke-width="3"/>
  <rect x="88" y="22" width="464" height="43" rx="22" fill="#e8f1ea"/>
  <circle cx="115" cy="43" r="5" fill="#b8cbbd"/><circle cx="132" cy="43" r="5" fill="#b8cbbd"/><circle cx="149" cy="43" r="5" fill="#b8cbbd"/>
  <text x="320" y="107" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#194c32">به زمان‌یار خوش آمدید</text>
  <text x="320" y="139" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#506c5a">برای هماهنگی بهتر تیم، نخستین جلسه را بسازید</text>
  <rect x="142" y="170" width="356" height="51" rx="12" fill="#167347"/>
  <text x="320" y="202" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="white">ساخت نخستین جلسه</text>
  <rect x="142" y="234" width="356" height="51" rx="12" fill="#f6faf7" stroke="#c9dacd"/>
  <text x="320" y="266" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#496a55">اتصال تقویم همکاران</text>
  <text x="320" y="313" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#748c7a">گام دوم برای دیدن زمان‌های مشترک</text>
</svg>
